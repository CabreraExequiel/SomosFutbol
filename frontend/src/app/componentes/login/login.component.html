<main class="contenedor-login"><form (ngSubmit)="onSubmit()" class="form-login" #form="ngForm">
 <a class="marca" routerLink="/">⚽ Somos Fútbol</a><span class="bienvenida">Volvé a la cancha</span><h1>Iniciá sesión</h1><p class="intro">Tus partidos, reservas y amigos, en un solo lugar.</p>
 @if(aviso){<p class="app-alert" role="status">{{aviso}}</p>}
 <label for="email">Correo electrónico</label><input id="email" type="email" name="email" autocomplete="email" [(ngModel)]="email" maxlength="150" required email />
 <label for="password">Contraseña</label><input id="password" [type]="mostrarClave?'text':'password'" name="password" autocomplete="current-password" [(ngModel)]="password" required />
 <button class="text-button" type="button" [attr.aria-pressed]="mostrarClave" (click)="mostrarClave=!mostrarClave">{{mostrarClave?'Ocultar contraseña':'Mostrar contraseña'}}</button>
 @if(error){<p class="error" role="alert">{{error}}</p>}
 <button class="ingresar" type="submit" [disabled]="cargando||form.invalid">{{cargando?'Ingresando…':'Ingresar →'}}</button>
 <p class="link">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
 <footer><a routerLink="/terminos-y-condiciones">Términos</a><a routerLink="/politica-de-privacidad">Privacidad</a></footer>
</form></main>
