@if (anuncios().length > 0) {
<section class="sf-publicidades" aria-label="Publicidades">
  <div class="sf-publicidades-cabecera"><span>Publicidad</span></div>
  <div class="sf-publicidades-lista">
    @for (anuncio of anuncios(); track anuncio.id) {
      <a class="sf-publicidad" [href]="anuncio.destinoUrl" target="_blank"
         rel="noopener noreferrer sponsored" [attr.aria-label]="'Publicidad: ' + anuncio.titulo + '. Abrir enlace externo'">
        @if (imagenSegura(anuncio.imagenUrl)) {
          <img [src]="anuncio.imagenUrl" [alt]="anuncio.titulo" loading="lazy" />
        }
        <div class="sf-publicidad-info">
          <strong>{{ anuncio.titulo }}</strong>
          @if (anuncio.descripcion) { <p>{{ anuncio.descripcion }}</p> }
          <span class="sf-publicidad-accion">Conocer más <span aria-hidden="true">↗</span></span>
        </div>
      </a>
    }
  </div>
</section>
}
