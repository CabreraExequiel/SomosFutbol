map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 6m;
    access_log /var/log/nginx/access.log privacy;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ^~ /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/proxy-api.conf;
    }
    location ^~ /api/pagos/webhook {
        include /etc/nginx/proxy-api.conf;
    }
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/proxy-api.conf;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location = /index.html { expires -1; }
    location ~* \.(?:css|js|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
