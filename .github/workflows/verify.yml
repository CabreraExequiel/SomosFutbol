
name: Verificar proyecto

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: canchasya
          MYSQL_USER: sf_test
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: local-ci-root-only
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend y pruebas unitarias
        run: mvn -B -f backend/pom.xml verify

      - name: Frontend de produccion
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Probar API con MySQL 8.4 y datos descartables
        env:
          SPRING_PROFILES_ACTIVE: dev

          DB_URL: jdbc:mariadb://127.0.0.1:3306/canchasya?sslMode=disable&allowPublicKeyRetrieval=true
          DB_USERNAME: sf_test
          DB_PASSWORD: local-ci-only

          SPRING_JPA_HIBERNATE_DDL_AUTO: create
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
          SPRING_FLYWAY_ENABLED: 'false'

          JWT_SECRET: clave-exclusiva-para-ci-local-sin-acceso-a-produccion-123456789
          PAYMENTS_ENABLED: 'false'
          MAIL_ENABLED: 'false'

          SF_TEST_API: http://127.0.0.1:8080/api

        run: |
          echo "=== INICIANDO BACKEND ==="

          java -jar backend/target/api-1.0.0.jar > backend-ci.log 2>&1 &
          backend_pid=$!

          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          echo "=== ESPERANDO SPRING BOOT ==="

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend saludable"
              break
            fi

            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "El backend se detuvo inesperadamente"
              tail -n 150 backend-ci.log
              exit 1
            fi

            sleep 2
          done

          echo "=== VERIFICANDO HEALTH CHECK ==="
          curl -fsS http://127.0.0.1:8080/actuator/health

          echo ""
          echo "=== CARGANDO CIUDAD DE PRUEBA ==="

          mysql_container=$(docker ps --filter "ancestor=mysql:8.4" -q | head -n 1)

          if [ -z "$mysql_container" ]; then
            echo "ERROR: No se encontro el contenedor MySQL de pruebas"
            exit 1
          fi

          docker exec "$mysql_container" mysql \
            -u sf_test \
            --password=local-ci-only \
            canchasya \
            -e "INSERT INTO ciudades (nombre, provincia) VALUES ('Comodoro Rivadavia', 'Chubut') ON DUPLICATE KEY UPDATE provincia=VALUES(provincia);"

          echo "=== VERIFICANDO CIUDADES ==="
          curl -fsS http://127.0.0.1:8080/api/ciudades

          echo ""
          echo "=== EJECUTANDO PRUEBAS FUNCIONALES ==="
          python3 tools/smoke.py

          echo "=== PRUEBAS FUNCIONALES FINALIZADAS ==="

      - name: Diagnosticar fallo del backend
        if: failure()
        run: |
          echo "=== REGISTRO SPRING BOOT ==="

          if [ -f backend-ci.log ]; then
            tail -n 200 backend-ci.log
          else
            echo "No se encontro backend-ci.log"
          fi

          echo "=== HEALTH CHECK ==="
          curl -i --max-time 10 http://127.0.0.1:8080/actuator/health || true

      - name: Construir contenedores
        run: |
          docker build -t sf-backend-check backend
          docker build -t sf-frontend-check frontend

      - name: Guardar diagnostico si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico
          path: |
            backend-ci.log
            backend/target/surefire-reports/
