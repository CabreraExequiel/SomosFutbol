
# ==========================================
# SERVIDOR
# ==========================================

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.shutdown=graceful
server.error.include-message=never

spring.lifecycle.timeout-per-shutdown-phase=20s

server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=10MB


# ==========================================
# APLICACION Y DATOS LEGALES
# ==========================================

spring.application.name=canchasya-api

app.legal.terms-version=${TERMS_VERSION:2026-10-09}
app.legal.privacy-version=${PRIVACY_VERSION:2026-10-09}

app.legal.operator=${LEGAL_OPERATOR:}
app.legal.tax-id=${LEGAL_TAX_ID:}
app.legal.address=${LEGAL_ADDRESS:}
app.legal.contact=${SUPPORT_EMAIL:}


# ==========================================
# BASE DE DATOS MYSQL - AIVEN
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canchasya}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Desarrollo local:
# update permite adaptar el esquema existente.
#
# Produccion:
# configurar JPA_DDL_AUTO=validate una vez
# aplicadas las migraciones correspondientes.

#spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# IMPORTANTE:
# Utilizar el dialecto MariaDB evita generar
# sintaxis de bloqueo propia de MySQL.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# FLYWAY
# ==========================================

# Temporalmente desactivado hasta conciliar
# las migraciones con la base existente.
#
# No activar ni ejecutar baseline de forma
# automatica sobre el esquema actual.

spring.flyway.enabled=${FLYWAY_ENABLED:false}

spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=5
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration


# ==========================================
# JWT
# ==========================================

# Reemplazar JWT_SECRET antes de produccion.

app.jwt.secret=${JWT_SECRET:desarrollo-cambiar-esta-clave-de-32-caracteres}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# FRONTEND Y CORS
# ==========================================

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.public-base-url=${PUBLIC_BASE_URL:}


# ==========================================
# MERCADO PAGO
# ==========================================

# Pagos desactivados por defecto.
# Activar cuando la integracion este lista.

app.payments.enabled=${PAYMENTS_ENABLED:false}

app.mercadopago.client-id=${MERCADOPAGO_CLIENT_ID:}
app.mercadopago.client-secret=${MERCADOPAGO_CLIENT_SECRET:}

app.mercadopago.encryption-key=${MP_ENCRYPTION_KEY:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

app.mercadopago.test-mode=${MERCADOPAGO_TEST_MODE:true}

app.backend-public-url=${BACKEND_PUBLIC_URL:}


# ==========================================
# CORREO ELECTRONICO
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}

management.health.mail.enabled=${MAIL_ENABLED:false}


# ==========================================
# ARCHIVOS Y FOTOGRAFIAS
# ==========================================

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

app.storage.location=${UPLOAD_DIR:./uploads}


# ==========================================
# LOGS Y MONITOREO
# ==========================================

logging.level.com.canchasya.api=INFO
logging.level.org.springframework.security=WARN

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
