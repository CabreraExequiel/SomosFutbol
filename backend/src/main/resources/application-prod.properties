spring.config.activate.on-profile=prod

app.jwt.secret=${JWT_SECRET}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.public-base-url=${PUBLIC_BASE_URL}
app.storage.location=${UPLOAD_DIR:/app/uploads}
app.payments.enabled=${PAYMENTS_ENABLED:false}
app.mercadopago.client-id=${MERCADOPAGO_CLIENT_ID:}
app.mercadopago.client-secret=${MERCADOPAGO_CLIENT_SECRET:}
app.mercadopago.encryption-key=${MP_ENCRYPTION_KEY:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.mercadopago.test-mode=${MERCADOPAGO_TEST_MODE:false}
app.backend-public-url=${BACKEND_PUBLIC_URL:${PUBLIC_BASE_URL}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000

logging.level.root=INFO
logging.level.com.canchasya.api=INFO

spring.flyway.baseline-on-migrate=false
server.forward-headers-strategy=framework
