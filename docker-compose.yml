name: somos-futbol
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: canchasya
      MYSQL_USER: canchasyapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defini DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defini DB_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://db:3306/canchasya?sslMode=DISABLED&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: canchasyapp
      DB_PASSWORD: ${DB_PASSWORD:?Defini DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defini JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-43200000}
      FRONTEND_URL: ${PUBLIC_URL:?Defini PUBLIC_URL}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Defini PUBLIC_URL}
      PUBLIC_BASE_URL: ${PUBLIC_URL:?Defini PUBLIC_URL}
      BACKEND_PUBLIC_URL: ${PUBLIC_URL:?Defini PUBLIC_URL}
      UPLOAD_DIR: /app/uploads
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      MERCADOPAGO_TEST_MODE: ${MERCADOPAGO_TEST_MODE:-true}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MP_ENCRYPTION_KEY: ${MP_ENCRYPTION_KEY:-}
      TERMS_VERSION: ${TERMS_VERSION:-2026-10-09}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-10-09}
      LEGAL_OPERATOR: ${LEGAL_OPERATOR:-}
      LEGAL_TAX_ID: ${LEGAL_TAX_ID:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *logging
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Defini DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    logging: *logging
volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
